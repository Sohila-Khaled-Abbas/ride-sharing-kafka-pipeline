name: CI — Ride-Sharing Kafka Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-run:
    name: Build, Test & Run Automated Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite (13 Tests)
        run: |
          python -m unittest discover tests -v

      - name: Run Automated Pipeline
        run: |
          python -m src.pipeline_runner --num-events 20 --dry-run

      - name: Validate Output Artifacts
        run: |
          test -f outputs/pipeline_run_summary.json
          test -f outputs/sample_trips.json
